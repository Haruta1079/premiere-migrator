name: Build & Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'バージョン番号 (例: v1.0.1)'
        required: true
        default: 'v1.0.1'

jobs:
  # ─────────────────────────────────────────────────────────────
  # Windows: PremiereMigratorSetup.exe (Inno Setup インストーラー)
  # ─────────────────────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install customtkinter pillow pyinstaller

      - name: Generate icon
        run: python create_icons.py

      - name: Build .exe with PyInstaller
        run: pyinstaller premiere_migrator.spec

      - name: Build installer with Inno Setup
        shell: pwsh
        env:
          APP_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || github.event.inputs.version }}
        run: |
          $ver = $env:APP_VERSION -replace '^v',''
          $env:APP_VERSION = $ver
          & "C:\Program Files (x86)\Inno Setup 6\iscc.exe" installer.iss

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/PremiereMigratorSetup.exe

  # ─────────────────────────────────────────────────────────────
  # macOS: PremiereMigrator.dmg
  # ─────────────────────────────────────────────────────────────
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install customtkinter pillow pyinstaller

      - name: Generate icons (.ico + .icns)
        run: python create_icons.py

      - name: Build .app with PyInstaller
        run: pyinstaller premiere_migrator.spec

      - name: Create .dmg
        run: |
          mkdir -p dist/dmg
          cp -r "dist/PremiereMigrator.app" "dist/dmg/"
          ln -s /Applications "dist/dmg/Applications"
          hdiutil create \
            -volname "Premiere Migrator" \
            -srcfolder dist/dmg \
            -ov \
            -format UDZO \
            dist/PremiereMigrator.dmg

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: mac-dmg
          path: dist/PremiereMigrator.dmg

  # ─────────────────────────────────────────────────────────────
  # GitHub Release を作成して両ファイルを添付
  # ─────────────────────────────────────────────────────────────
  release:
    needs: [build-windows, build-mac]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: artifacts/windows

      - name: Download macOS DMG
        uses: actions/download-artifact@v4
        with:
          name: mac-dmg
          path: artifacts/mac

      - name: Determine version tag
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Premiere Migrator ${{ steps.version.outputs.tag }}"
          draft: false
          prerelease: false
          body: |
            ## Premiere Migrator ${{ steps.version.outputs.tag }}

            Premiere Proの設定（MOGRTテンプレート・エフェクトプリセット・キーボードショートカット・ワークスペース）をPC間・Mac↔Windows間で一括移行できるツールです。

            ### ダウンロード

            | OS | ファイル | 手順 |
            |---|---|---|
            | Windows | `PremiereMigratorSetup.exe` | ダブルクリックしてインストール |
            | Mac | `PremiereMigrator.dmg` | 開いてApplicationsフォルダへドラッグ |

            > **Macの注意**: 初回起動時に警告が出た場合は、Controlキーを押しながらクリック→「開く」を選択してください。
          files: |
            artifacts/windows/PremiereMigratorSetup.exe
            artifacts/mac/PremiereMigrator.dmg
